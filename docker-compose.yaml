services:
  bot:
    build: .
    ports:
      - "3005:3005"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./service-account.json:/app/service-account.json:ro
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
